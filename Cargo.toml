# ggraph — a domain-agnostic graph execution engine.
#
# One workspace, versions moving in lockstep, one tag per release. Two consumers today, one
# continuous-dataflow and one durable-task-orchestration. No consumer's vocabulary may appear in
# here — CI greps for it.
[workspace]
members = ["ggraph-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
repository = "https://github.com/jackesdavid/graph-engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
